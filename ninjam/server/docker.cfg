# Default config for the container image. Mount your own over /config/ninjamsrv.cfg.
Port 2049
# Live: Jamsa players can hear each other in real time over UDP on the same port
# (publish it with -p 2049:2049/udp); rooms start with it off, !live on turns it on
Live yes
MaxUsers 16
MaxChannels 32 4
AnonymousUsers yes
AnonymousUsersCanChat yes
AnonymousMaskIP yes
DefaultTopic "Welcome to NINJAM. Please play nicely."
DefaultBPM 120
DefaultBPI 8
SetVotingThreshold 50
SetVotingVoteTimeout 60
