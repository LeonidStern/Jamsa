# Default config for the container image. Mount your own over /config/ninjamsrv.cfg.
Port 2049
MaxUsers 16
MaxChannels 32 4
AnonymousUsers yes
AnonymousUsersCanChat yes
AnonymousMaskIP yes
DefaultTopic "Welcome to NINJAM. Please play nicely."
DefaultBPM 120
DefaultBPI 8
SetVotingThreshold 50
SetVotingVoteTimeout 60
