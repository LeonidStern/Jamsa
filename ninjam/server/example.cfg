# only one port line allowed (last one will be used)
# these are comments
Port 2049

# ask the router to forward the port to this machine (UPnP or NAT-PMP), so you don't
# have to set up port forwarding by hand. Needs a server built with PORTMAP=1.
# The log says which address people can connect to, or why it didn't work. With Live
# (below) it forwards the UDP port too, if the router lets it.
PortMapping no

# limit connections that haven't logged in yet: total, and per IP address (0 = no limit)
MaxPendingConnections 64 8



# limit connections of normal users to 10
MaxUsers 10

# limit normal users to 32 channels each, anonymous users to 2
MaxChannels 32 2

# codecs besides Ogg Vorbis that the server relays: any of opus, flac, or none.
# A codec is only used in a room when everyone there can decode it; people whose
# client can't decode it get silence instead. FLAC is lossless and needs several
# times the bandwidth, so it is off unless listed here.
AllowCodecs opus

# refuse clients that can't play this codec (opus, flac or none), with "this server
# needs a NINJAM client that plays Opus". Rooms then never fall back to Vorbis, and
# !codec vorbis is refused. Without it, older clients that only play Vorbis can join.
#RequireCodec opus

# the Opus bitrate (kbps, 32 to 510) everyone in a room sends, so all players sound the
# same; any player can change it with !bitrate N. Clients that don't know it send their
# own. With none, each client picks its own.
OpusBitrate 128

# Live: players whose client can play it (Jamsa) hear each other in real time instead
# of one interval later, over UDP on the same port number as TCP (forward both on your
# router). Everyone else stays on intervals and still hears everyone.
#   no      = off (the default)
#   yes     = open the UDP port; rooms start with Live off, and !live on turns it on
#   on      = the same, but rooms start with Live on
#   require = like yes, but the server doesn't start if it can't open the UDP port
# With yes or on, a server that can't open the UDP port says so and runs without Live.
# Anyone who can vote can turn it on or off with !live on|off; !live shows who can play it.
Live no

# the Opus bitrate (kbps, 32 to 510) and frame size (samples at 48 kHz: 120, 240 or
# 480, that is 2.5, 5 or 10 ms) of Live audio. Smaller frames have less delay and
# more overhead.
#LiveKbps 128
#LiveFrame 240

# how many players in a room can play Live (1 to 64); the others, in join order, stay
# on intervals. Each player receives a stream from every other, so their bandwidth
# grows with this number.
#LiveMaxPeers 8

# the UDP port players send to, when it isn't Port (for example when the router
# forwards another outside port to this machine). 0 = the same as Port. The server
# itself always listens on Port.
#LivePort 0

# only accept Live audio from the address a player connected from over TCP. Turn it
# off when players' UDP comes from another address than their TCP (some mobile and
# carrier-grade NAT networks); their key still has to match. Either way, the server
# sends a player audio only at an address that has shown it gets what is sent there.
#LiveStrictAddress yes

ServerLicense cclicense.txt

#anonymoususers yes or no, or multi (to allow multiple users of the same name from the same IP)
AnonymousUsers no
AnonymousUsersCanChat yes
AnonymousMaskIP yes  # shows just the nn.nn.nn.x instead of full IP. 


AllowHiddenUsers no   # set to yes to allow people without channels to not appear in the user list


#ACL list lets you specify in order a list, first match is used
ACL 10.0.0.0/8 deny
ACL 192.168.0.0/16 reserve # reserve slots for local
ACL 0.0.0.0/0 allow        # allow all


#user/password/permissions sets
User administrator myadminpass *   # allow all functions
User booga anotherpass CBTKRMHVP      # allow chat, bpm/bpi, topic changing, and kicking, a reserved slot, multiple logins voting, show private rooms in stat
User myuser mypass                 # allow default functions (chat, no topic)

# optional user/pass with simple status retrieving permissions (this also has the advantage of having the server do less work)
# StatusUserPass username password

DefaultTopic "Welcome to NINJAM. Please play nicely."
DefaultBPM 120
DefaultBPI 8

# two parameters: path to log to, and session length (in minutes). 0 for length means 30 seconds.
# if the first parameter (path) is empty, no logging is done
# SessionArchive . 15


# these two require a full restart to update:

# write PID file (non-windows version only)
# PIDFile ninjamserver.pid

# LogFile ninjamserver.log


# set keep-alive interval in seconds. should probably not bother
# specifying this, the default is 3, which is adequate. 
# SetKeepAlive 3

# voting system:
# SetVotingThreshold 50       # sets threshold to 50%. can be 1-100%, or >100 to disable
# SetVotingVoteTimeout 60     # sets timeout before votes are reset, in seconds

# MOTDFile motd.txt   # send this text as a privmsg to all users when they connect


# PrivateGroupMode 20         # max rooms
# PrivateGroupLobbySize 10    # max people in lobby
# PrivateGroupAllowChat yes   # allow chat in lobby, to join a room use !join xyz. if chat disabled than any string that doesn't begin with ! or contain spaces will do
# PrivateGroupLobbyMOTDFile   motdlobby.txt # lobby motd file
# PrivateGroupPublicPrefix ""   # server will list channels with this prefix (e.g. '#'). empty for all channels are private
