name: ninjam-vst3

# Builds Jamsa, the NINJAM VST3 plug-in (ninjam/vst3), on Linux, Windows and macOS, checks it with
# Steinberg's validator and Tracktion's pluginval (which also opens the editor), runs the
# plug-in's tests and uploads what users install.

on:
  push:
    branches: [main]
    paths: ['ninjam/**', 'WDL/**', '.github/workflows/ninjam-vst3.yml']
  pull_request:
    paths: ['ninjam/**', 'WDL/**', '.github/workflows/ninjam-vst3.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # pluginval release and the SHA-256 of each of its zips
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SHA256_LINUX: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  # pluginval v1.0.4 validates in its own process (it has no --validate-in-process flag) and
  # runs the tests that open the editor unless --skip-gui-tests is given, so neither is passed.
  PLUGINVAL_ARGS: --strictness-level 10 --timeout-ms 120000 --output-dir pluginval-logs

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test packages
        run: |
          sudo apt-get update
          # VSTGUI on Linux; Xvfb (and ALSA, which pluginval links) for the editor tests;
          # the system codecs and Vorbis for the old clients of the end-to-end test; gtkmm only
          # because the VST3 SDK always configures VSTGUI's standalone library (not linked in)
          sudo apt-get install -y ninja-build libgtkmm-3.0-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libfontconfig-dev libfreetype-dev libwayland-dev wayland-protocols \
            xvfb xauth libasound2t64 \
            libopus-dev libflac-dev libogg-dev libvorbis-dev
          # the unit test also reads and writes the state in a locale that writes 95,5
          sudo locale-gen de_DE.UTF-8

      - name: Configure
        run: cmake -S ninjam/vst3 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNINJAM_VST3_TESTS=ON

      - name: Build
        run: |
          cmake --build build --target Jamsa validator plugin_unit_test plugin_e2e_host -- -k 0
          # what gets validated, tested and shipped
          strip --strip-unneeded build/VST3/Release/Jamsa.vst3/Contents/x86_64-linux/Jamsa.so
          ls -l build/VST3/Release/Jamsa.vst3/Contents/x86_64-linux/

      - name: Steinberg validator
        run: |
          build/bin/Release/validator -e build/VST3/Release/Jamsa.vst3 2>&1 | tee validator.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator.log

      - name: pluginval (with the editor, under Xvfb)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Linux.zip"
          echo "$PLUGINVAL_SHA256_LINUX  pluginval.zip" | sha256sum -c -
          unzip -q -o pluginval.zip -d pluginval
          xvfb-run -a -s "-screen 0 1400x900x24" pluginval/pluginval $PLUGINVAL_ARGS --validate build/VST3/Release/Jamsa.vst3

      - name: Servers and old clients for the end-to-end test
        run: |
          make -C ninjam/server -j"$(nproc)"
          make -C ninjam/tests -j"$(nproc)" njclient_e2e_vorbis

      - name: Tests
        env:
          NINJAMSRV: ${{ github.workspace }}/ninjam/server/ninjamsrv
          NJCLIENT_E2E_VORBIS: ${{ github.workspace }}/ninjam/tests/njclient_e2e_vorbis
        run: ctest --test-dir build --output-on-failure -V

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/VST3/Release/Jamsa.vst3 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Jamsa-vst3-linux-x86_64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux
          path: |
            validator.log
            pluginval-logs/
          if-no-files-found: ignore

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, static runtime, single-file Jamsa.vst3)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where ninja >nul 2>nul || choco install ninja --no-progress -y || exit /b 1
          cmake -S ninjam/vst3 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNINJAM_VST3_TESTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DSMTG_USE_STATIC_CRT=ON || exit /b 1
          cmake --build build --target Jamsa validator plugin_unit_test -- -k 0 || exit /b 1

      - name: Find the plug-in and the validator
        shell: bash
        run: |
          PLUGIN=$(find build/VST3 -name Jamsa.vst3 -type f | head -1)
          VALIDATOR=$(find build/bin -name validator.exe -type f | head -1)
          test -n "$PLUGIN" && test -n "$VALIDATOR"
          echo "PLUGIN=$PLUGIN" >> "$GITHUB_ENV"
          echo "VALIDATOR=$VALIDATOR" >> "$GITHUB_ENV"
          ls -l "$PLUGIN"

      - name: DLLs it needs (no Visual C++ runtime)
        shell: bash
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          DUMPBIN=$(cygpath -u "$("$VSWHERE" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -1 | tr -d '\r')")
          MSYS_NO_PATHCONV=1 "$DUMPBIN" /nologo /dependents "$PLUGIN" | tee dependents.txt
          if grep -i -E "vcruntime|msvcp|ucrtbase|api-ms-win-crt" dependents.txt; then
            echo "Jamsa.vst3 needs the Visual C++ runtime; it should be built with /MT"
            exit 1
          fi

      - name: Steinberg validator (single file, and in the folder layout)
        shell: bash
        run: |
          # As one file, the only check it may fail is the bundle check ("Not a bundle");
          # in the folder layout below it must pass everything.
          "$VALIDATOR" -e "$PLUGIN" 2>&1 | tee validator.log || true
          grep -F "Invalid bundle structure: Not a bundle" validator.log
          grep -E "Result: [0-9]+ tests passed, 1 tests failed" validator.log
          mkdir -p validate/Jamsa.vst3/Contents/x86_64-win
          cp "$PLUGIN" validate/Jamsa.vst3/Contents/x86_64-win/Jamsa.vst3
          "$VALIDATOR" -e validate/Jamsa.vst3 2>&1 | tee validator-folder.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator-folder.log

      - name: pluginval (with the editor)
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          echo "$PLUGINVAL_SHA256_WINDOWS  pluginval.zip" | sha256sum -c -
          7z x -y -opluginval pluginval.zip
          pluginval/pluginval.exe $PLUGINVAL_ARGS --validate "$PLUGIN" && status=0 || status=$?
          cat pluginval-logs/*.txt || true
          exit $status

      - name: Tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "$PLUGIN" dist/Jamsa.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: Jamsa-vst3-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: |
            dependents.txt
            validator*.log
            pluginval-logs/
          if-no-files-found: ignore

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      BUNDLE: build/VST3/Release/Jamsa.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure (universal, macOS 12 and later)
        run: cmake -S ninjam/vst3 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNINJAM_VST3_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --target Jamsa validator plugin_unit_test plugin_e2e_host -- -k 0

      - name: Strip and sign (ad hoc)
        run: |
          strip -x "$BUNDLE/Contents/MacOS/Jamsa"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"

      - name: Check the bundle
        run: |
          BIN="$BUNDLE/Contents/MacOS/Jamsa"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -w arm64 && lipo -archs "$BIN" | grep -w x86_64
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep minos
          plutil -p "$BUNDLE/Contents/Info.plist"
          test "$(plutil -extract CFBundlePackageType raw "$BUNDLE/Contents/Info.plist")" = BNDL

      - name: Tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Are there Developer ID secrets?
        id: devid
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets: the bundle stays ad hoc signed and isn't notarized."
          fi

      - name: Sign with Developer ID, notarize and staple
        if: steps.devid.outputs.notarize == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then echo "MACOS_CERT_P12 has no Developer ID Application certificate"; exit 1; fi

          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"

          ditto -c -k --keepParent "$BUNDLE" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notarize.json" || true
          cat "$RUNNER_TEMP/notarize.json"
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notarize.json" 2>/dev/null || echo unknown)
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization: $STATUS"
            ID=$(plutil -extract id raw "$RUNNER_TEMP/notarize.json" 2>/dev/null || true)
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$BUNDLE"
          xcrun stapler validate "$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"

      - name: Remove the signing keychain
        if: always() && steps.devid.outputs.notarize == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Steinberg validator
        run: |
          build/bin/Release/validator -e "$BUNDLE" 2>&1 | tee validator.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator.log

      - name: pluginval (with the editor)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          echo "$PLUGINVAL_SHA256_MACOS  pluginval.zip" | shasum -a 256 -c -
          ditto -x -k pluginval.zip pluginval
          pluginval/pluginval.app/Contents/MacOS/pluginval $PLUGINVAL_ARGS --validate "$BUNDLE"

      - name: Package
        run: |
          # Finder shows a folder whose extension no app has registered (like .vst3) as a plain
          # folder unless its bundle bit is set (kHasBundle in its Finder info), so set it: then
          # Jamsa.vst3 shows as one file, like other plug-ins. It is set last, on a copy, after the
          # checks above, because codesign --strict rejects any extended attribute on the bundle;
          # the signature itself covers the files inside and stays valid. ditto zips the Finder
          # info of what is inside the folder it is given (not of that folder itself), the way
          # Finder's Compress does (--sequesterRsrc: in __MACOSX/), and unzipping restores it.
          mkdir -p stage dist
          ditto "$BUNDLE" stage/Jamsa.vst3
          xattr -wx com.apple.FinderInfo 0000000000000000200000000000000000000000000000000000000000000000 stage/Jamsa.vst3
          ditto -c -k --sequesterRsrc stage dist/Jamsa-vst3-macos.zip
          ls -l dist
          zipinfo -1 dist/Jamsa-vst3-macos.zip | grep -Fx "__MACOSX/._Jamsa.vst3"
          # what someone gets after unzipping: the bundle bit, a valid signature, a plug-in that loads
          ditto -x -k dist/Jamsa-vst3-macos.zip "$RUNNER_TEMP/unzipped"
          UNZIPPED="$RUNNER_TEMP/unzipped/Jamsa.vst3"
          test "$(xattr -px com.apple.FinderInfo "$UNZIPPED" | tr -d ' \n' | cut -c17-20)" = 2000
          codesign --verify --deep --verbose=2 "$UNZIPPED"
          build/bin/Release/validator "$UNZIPPED" 2>&1 | tee validator-unzipped.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator-unzipped.log

      - name: Disk image
        run: |
          # The Mac download: a disk image with Jamsa.vst3 next to a shortcut to the VST3 folder,
          # over a background that says to drag one onto the other (ninjam/vst3/packaging).
          # dmgbuild lays it out in a read-write image; the bundle bit is set in there, for the
          # reasons above, and then the image is compressed.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install -q dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s ninjam/vst3/packaging/dmg_settings.py \
            -D bundle="$BUNDLE" -D background=ninjam/vst3/packaging/dmg-background.png \
            Jamsa "$RUNNER_TEMP/Jamsa-rw.dmg"
          RW="$RUNNER_TEMP/dmg-rw"
          hdiutil attach -nobrowse -noautoopen -mountpoint "$RW" "$RUNNER_TEMP/Jamsa-rw.dmg"
          xattr -wx com.apple.FinderInfo 0000000000000000200000000000000000000000000000000000000000000000 "$RW/Jamsa.vst3"
          hdiutil detach "$RW" || { sleep 5; hdiutil detach -force "$RW"; }
          hdiutil convert "$RUNNER_TEMP/Jamsa-rw.dmg" -format UDZO -imagekey zlib-level=9 -o dist/Jamsa-vst3-macos.dmg
          ls -l dist
          # what someone gets: the shortcut, the layout, the bundle bit, a valid signature, a plug-in that loads
          RO="$RUNNER_TEMP/dmg-check"
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$RO" dist/Jamsa-vst3-macos.dmg
          ls -la "$RO"
          test "$(readlink "$RO/VST3 Plug-Ins")" = /Library/Audio/Plug-Ins/VST3
          test -f "$RO/.DS_Store"
          ls "$RO"/.background.*
          test "$(xattr -px com.apple.FinderInfo "$RO/Jamsa.vst3" | tr -d ' \n' | cut -c17-20)" = 2000
          codesign --verify --deep --verbose=2 "$RO/Jamsa.vst3"
          build/bin/Release/validator "$RO/Jamsa.vst3" 2>&1 | tee validator-dmg.log
          grep -E "Result: [0-9]+ tests passed, 0 tests failed" validator-dmg.log
          hdiutil detach "$RO"

      - uses: actions/upload-artifact@v4
        with:
          name: Jamsa-vst3-macos-universal
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos
          path: |
            validator.log
            pluginval-logs/
          if-no-files-found: ignore

  # The downloads in the README: each push to main puts that build of all three in the
  # release "jamsa-latest" (the tag moves to the commit), replacing the files there.
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: jamsa-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jamsa-vst3-linux-x86_64
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: Jamsa-vst3-windows-x64
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: Jamsa-vst3-macos-universal
          path: macos

      - name: Zip the downloads
        run: |
          mkdir release
          (cd linux && zip -qr ../release/Jamsa-vst3-linux-x86_64.zip Jamsa.vst3)
          (cd windows && zip -q ../release/Jamsa-vst3-windows-x64.zip Jamsa.vst3)
          # made on the Mac, with the bundle bit (see the macos job)
          cp macos/Jamsa-vst3-macos.dmg macos/Jamsa-vst3-macos.zip release/
          ls -l release

      - name: Publish to the jamsa-latest release
        run: |
          NOTES="The newest build of Jamsa, from ${GITHUB_SHA::7} on main. See the README for how to install it."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jamsa (latest build)" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Jamsa (latest build)" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
