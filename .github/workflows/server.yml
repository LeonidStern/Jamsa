name: server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install port mapping libraries
        run: sudo apt-get update && sudo apt-get install -y libminiupnpc-dev libnatpmp-dev
      - name: Build with AddressSanitizer and UBSan
        run: make -C ninjam/server -j"$(nproc)" PORTMAP=1 CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wno-reorder -pthread"
      - name: Protocol tests
        working-directory: ninjam/server/tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          NINJAMSRV: ../ninjamsrv
        run: python3 -m unittest -v test_server test_live
      - name: Release build, without port mapping
        run: |
          make -C ninjam/server clean
          make -C ninjam/server -j"$(nproc)"

  # the same tests against the server built into the plug-in, through the embedded API
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the embedded server runner with AddressSanitizer and UBSan
        run: |
          cmake -S ninjam/server -B build-embedded -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNINJAM_SERVER_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-embedded --target ninjamsrv_embedded_runner -j"$(nproc)"
      - name: Protocol tests
        working-directory: ninjam/server/tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          NINJAMSRV: ${{ github.workspace }}/build-embedded/ninjamsrv_embedded_runner
        run: python3 -m unittest -v test_server test_live

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C ninjam/server -j"$(sysctl -n hw.ncpu)" MAC=1

  client-opus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codec libraries
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libflac-dev libogg-dev libvorbis-dev
      - name: Build the server and the client tests
        run: |
          make -C ninjam/server -j"$(nproc)"
          make -C ninjam/tests -j"$(nproc)"
      - name: Opus encoder/decoder round trip
        run: ninjam/tests/opus_codec_test
      - name: FLAC encoder/decoder round trip
        run: ninjam/tests/flac_codec_test
      - name: Two clients through the server
        working-directory: ninjam/tests
        env:
          NINJAMSRV: ../server/ninjamsrv
        run: python3 -m unittest -v test_codecs_e2e
